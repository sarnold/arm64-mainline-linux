name: Linux arm64 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Get version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          echo ${{ env.VERSION }}

      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout linux-stable
        uses: actions/checkout@v6
        with:
          repository: RobertCNelson/linux-stable-rcn-ee
          path: linux-stable

      - name: Install build deps (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdw-dev bindgen rust-src rustc rustfmt
          sudo apt-get install -y lzma gettext libmpc-dev u-boot-tools libncurses5-dev:amd64 xz-utils
          sudo apt-get install -y git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup env and build it
        run: |
          cd main/
          cp -v system.sh.sample system.sh
          echo "AUTO_BUILD=1" >> system.sh
          echo "CC=aarch64-linux-gnu-" >> system.sh
          echo "LINUX_GIT=../linux-stable/" >> system.sh
          git config --global --add safe.directory ../linux-stable
          ./build_kernel.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v6
        if: github.ref_type != 'tag'
        with:
          name: kernel-arm64
          path: ./main/deploy/*

      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: Linux kernel-${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            main/deploy/*

